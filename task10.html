<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10</title>
    <style>
        .product{
            height:400px;
            width:400px;
            background-color: #E89951;
            border-radius: 15px;
        }
        #product-name{
             text-align: center;
             font-size: larger;
             font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #photo{
            height:200px;
            width:300px;
            background-color: #ECB65F;
            border-radius: 15px;
            margin:auto;
        }
        #description{
            font-size: larger;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin:10px;

        }
        #price{
            font-size:larger;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin:10px;
        }
        #buy-button{
            height:30px;
            width:300px;
            background-color: #A5CF83;
            border-radius: 15px;
            text-align: center;
            padding-top:2px;
            margin:auto;
        }
        #buy-button:hover{
            background-color: #fcfcfc;
        }
    </style>
</head>
<body>
    <h1>Product Information Card</h1>
    <div class="product">
        <p id="product-name">Bluetooth HeadPhones</p>
        <p id="photo"></p>
        <p id="description">It's a No:1 Sony brand headphones</p>
        <p id="price">$100</p>
        <p id="buy-button">Buy</p>

    </div>
</body>
</html>
