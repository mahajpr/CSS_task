<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9</title>
    <style>
.box {
  position: relative;
  padding: 20px;
  background-color: #f0f0f0;
  height: 200px;
}

.box {
  width: 100px;
  height: 100px;
  background-color: #3498db;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-weight: bold;
}


.relative-box {
  position: relative;
  left: 50px;   
  top: 30px;    
}


.original-space-visualizer {
  position: absolute;
  width: 100px;
  height: 100px;
  border: 2px dashed #7f8c8d;
  pointer-events: none;
}
</style>
</head>
<body>
    <h1>Relative Position Pratice</h1>
    <div class="box">
        <div class="original-space-visualizer"></div>
        <div class="box relative-box">Moved Box</div>
    </div>
</body>
</html>
