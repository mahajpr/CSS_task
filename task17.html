<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 17</title>
    <style>

        .icon-container {
        position: relative;      
        display: inline-block;    
        font-size: 32px;          
        }

        .notification-badge {
        position: absolute;       
        top: -5px;               
        right: -5px;            
        background-color: red;    
        color: white;             
        font-size: 12px;         
        font-weight: bold;        
        min-width: 18px;          
        height: 18px;
        border-radius: 50%;   
        border: 2px solid white;  
        display: flex;
        align-items: center;
        justify-content: center;
        }

    </style>
</head>
<body>
    <h1>Notification Badge</h1>
<div class="icon-container">

  <div class="main-icon">🔔</div>

  <div class="notification-badge">5</div>

</div>

</body>
